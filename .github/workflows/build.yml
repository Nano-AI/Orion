name: Build (macOS, Windows, Linux)

# The engine, its tests, the Avalonia shell and its headless selftest on all
# three systems, and each system's packages as artifacts (decision #376): Velopack's
# installers and update feed, and the Mac disk image (#389). Never releases or tags:
# web/js/download.js offers a build, and an installed Orion updates to one, only
# once a release carries it, and making one is the developer's call.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELL_DIR: shell   # the one place this workflow names the shell's path
  SLANG_VERSION: 2026.14.1           # third_party/slang's version (decision #375)
  DAWN_CACHE: 106704a9-1             # Dawn's commit, and a revision: bump it when tools/build-dawn.sh changes
  # SHA-256 of each download that is run or ships, from the release's own digest.
  SLANG_SHA256_LINUX: 21f2d7847385a770e569fb61b1507a7794d742d97850bce0432bff0032ca005f
  SLANG_SHA256_WINDOWS: 5ed0a59d650a0af0aca45d5db4e083b3d8fb5cea05748747dd95dfbe9c580658
  SLANG_SHA256_MACOS: 92da7ab6226dd951037cd85397f830ae78fe40fbbb8928882e0b2654e468fdd4
  VPK_VERSION: 1.2.161               # Velopack's packer, the shell's Velopack package's version (#389)
  CMAKE_VERSION: 3.31.6               # Ubuntu 22.04's is 3.22; the project asks for 3.24
  CMAKE_SHA256_LINUX: 5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf
  LLVM_VERSION: 18                    # apt.llvm.org's, the Clang the Ubuntu 24.04 build used
  LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
  INNOSETUP_VERSION: 6.7.1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Built, tested and packaged in Ubuntu 22.04, so the AppImage starts on glibc 2.35
  # and later (decision #404): Ubuntu 22.04, Debian 12 and newer. Clang from
  # apt.llvm.org, every library from vcpkg's source, Dawn built here too, and the
  # C++ runtime linked in and kept private (-static-libstdc++ -static-libgcc,
  # --exclude-libs: .NET loads the system's libstdc++ into the same process).
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    env:
      ORION_VCPKG: /opt/vcpkg        # container paths: github.workspace names the host's
      VCPKG_DEFAULT_BINARY_CACHE: /opt/vcpkg-cache
      CC: clang
      CXX: clang++
      STATIC_RUNTIME: -static-libstdc++ -static-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a:libgcc_eh.a
    steps:
      # Before the checkout: without git, actions/checkout downloads a tarball and
      # git describe has nothing to name the package by.
      - name: Packages
        run: |
          apt-get update
          # Build tools only. The engine's libraries are vcpkg's, as on Windows: Ubuntu's
          # OpenCV is built with GDAL, which brings poppler, and poppler is GPL (#243, #376).
          # libicu70 is for the .NET SDK itself; the package carries its own ICU.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg python3 make g++-12 libstdc++-12-dev ninja-build nasm \
            pkg-config autoconf autoconf-archive automake libtool bison flex zip unzip tar xz-utils \
            zstd file libvulkan1 vulkan-tools patchelf libicu70 libfontconfig1 \
            squashfs-tools   # mksquashfs, for vpk's AppImage (#389)
          curl -fsSL -o /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons /tmp/llvm.key | grep -q "^fpr:::::::::$LLVM_KEY_FINGERPRINT:"
          gpg --dearmor -o /usr/share/keyrings/llvm.gpg /tmp/llvm.key
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-$LLVM_VERSION main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION"
          for t in clang clang++ llvm-nm llvm-ar llvm-ranlib; do ln -sf "/usr/bin/$t-$LLVM_VERSION" "/usr/local/bin/$t"; done
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
          echo "$CMAKE_SHA256_LINUX  /tmp/cmake.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cmake.tar.gz -C /opt && ln -sf "/opt/cmake-$CMAKE_VERSION-linux-x86_64/bin/"* /usr/local/bin/
          clang++ -v 2>&1 | grep -E 'version|Selected GCC'   # Clang 18 on GCC 12's libstdc++

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: { fetch-depth: 0 }     # git describe names the package
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container's root is not the checkout's owner

      - name: vcpkg at the manifest's baseline
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg "$ORION_VCPKG"
          "$ORION_VCPKG/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: vcpkg packages (cached)
        id: vcpkg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-jammy-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg-triplets/*', 'tools/vcpkg-ports/**') }}
          restore-keys: vcpkg-linux-jammy-   # vcpkg's own cache is by package ABI: an older one still serves

      # The runner has no GPU, so Dawn's Vulkan backend runs on a CPU driver.
      # SwiftShader, at the commit Dawn's DEPS pins: Mesa's lavapipe (25.2) cannot
      # blend into SNORM targets, so Dawn withholds TextureFormatsTier1 there,
      # which the engine requires (r16float/rg16float/r16uint storage).
      - name: SwiftShader (cached)
        id: swiftshader
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: swiftshader
          key: swiftshader-cddb5c91-jammy-1
      - name: SwiftShader (build)
        if: steps.swiftshader.outputs.cache-hit != 'true'
        run: |
          ss="$RUNNER_TEMP/ss"
          mkdir -p "$ss" && cd "$ss" && git init -q .
          git fetch -q --depth 1 https://swiftshader.googlesource.com/SwiftShader cddb5c91b23ff70a1f607ea31610aa0d7f4b5ad5
          git checkout -q FETCH_HEAD
          cmake -S "$ss" -B "$ss-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DREACTOR_BACKEND=Subzero \
            -DSWIFTSHADER_BUILD_TESTS=OFF -DSWIFTSHADER_BUILD_BENCHMARKS=OFF -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF
          cmake --build "$ss-build" --target vk_swiftshader
          mkdir -p "$GITHUB_WORKSPACE/swiftshader"
          cp "$ss-build"/Linux/libvk_swiftshader.so "$ss-build"/Linux/vk_swiftshader_icd.json "$GITHUB_WORKSPACE/swiftshader/"
      - if: steps.swiftshader.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: swiftshader
          key: ${{ steps.swiftshader.outputs.cache-primary-key }}
      - name: Use SwiftShader
        run: |
          echo "VK_ICD_FILENAMES=$GITHUB_WORKSPACE/swiftshader/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$GITHUB_WORKSPACE/swiftshader/vk_swiftshader_icd.json" vulkaninfo --summary || true

      - name: Slang
        run: |
          mkdir -p third_party/slang
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-linux-x86_64.tar.gz"
          echo "$SLANG_SHA256_LINUX  $RUNNER_TEMP/slang.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C third_party/slang

      # Restore and save apart, so a later failing step still keeps a 40-minute build.
      - name: Dawn (cached)
        id: dawn
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: dawn-linux-jammy-${{ env.DAWN_CACHE }}   # built in the 22.04 container (#404)
      - name: Dawn (build)
        if: steps.dawn.outputs.cache-hit != 'true'
        run: tools/build-dawn.sh && rm -rf third_party/dawn-src
      - if: steps.dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: ${{ steps.dawn.outputs.cache-primary-key }}

      # What of Dawn's third_party/ the static library carries, for NOTICE (#376):
      # the C++ namespaces it defines and the source directories its asserts name.
      - name: Dawn third-party audit
        run: |
          set +o pipefail
          libs=(third_party/dawn-build/lib/*webgpu_dawn*); lib=${libs[0]}; ls -la third_party/dawn-build/lib
          nm="nm"; command -v llvm-nm >/dev/null && nm="llvm-nm"
          "$nm" -C --defined-only "$lib" 2>/dev/null | awk '{ $1=""; $2=""; print }' \
            | grep -oE '^ *(\(anonymous namespace\)::)?[A-Za-z_][A-Za-z0-9_]*::' | sort | uniq -c | sort -rn | head -60
          "$nm" --defined-only "$lib" 2>/dev/null | awk '{print $3}' | grep -E '^_?(vk|spv|D3D|DXGI|dxc)' | cut -c1-40 | sort -u | head -40
          # shellcheck disable=SC1003 # tr's argument is one backslash, not an escaped quote
          grep -aoE 'third_party[\\/]+[A-Za-z0-9_.-]+([\\/]+[A-Za-z0-9_.-]+){0,3}' "$lib" | tr '\\' / | sed 's#/\+#/#g' | sort | uniq -c | sort -rn | head -60

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DORION_SHELL_DIR="$SHELL_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$ORION_VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/tools/vcpkg-triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic-release \
            -DCMAKE_SHARED_LINKER_FLAGS="$STATIC_RUNTIME" -DCMAKE_MODULE_LINKER_FLAGS="$STATIC_RUNTIME" \
            -DCMAKE_EXE_LINKER_FLAGS="$STATIC_RUNTIME"
          cmake --build build -- -k 0   # every error in one run, not the first
      - if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}

      # The libraries the shim loads, and none of the GPL ones a distribution's
      # OpenCV once brought (package-gates.py checks the licence texts as well).
      - name: No GPL library in the shim's closure
        run: |
          ldd build/shell-native/liborion_shim.so
          if ldd build/shell-native/liborion_shim.so | grep -Ei 'poppler|gdal|x265|avcodec|gpl'; then exit 1; fi

      # ⚠ No CPU Vulkan driver offers TextureFormatsTier1 (lavapipe and SwiftShader
      # both lack blendable SNORM/norm16 targets), so Dawn refuses the adapter here
      # and every GPU check is a stated skip; maths, decode and export still run.
      # Real Linux GPUs (radv, anv, NVIDIA) offer it. Decision #376.
      - name: orion-tests (Dawn on Vulkan, SwiftShader; GPU checks skip)
        env: { ORION_TESTS_GPU_OPTIONAL: '1' }
        run: ./build/apps/tests/orion-tests

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with: { dotnet-version: '10.0.x' }

      - name: Shell selftest (headless)
        run: |
          dotnet build "$SHELL_DIR" -c Release
          cp build/shell-native/liborion_shim.so "$SHELL_DIR/bin/Release/net10.0/"
          # The engine looks for shaders/ and data/ beside the executable (ResourcePaths.cpp).
          cp -R build/shaders "$SHELL_DIR/bin/Release/net10.0/shaders"
          mkdir -p "$SHELL_DIR/bin/Release/net10.0/data" && cp -R data/lensfun "$SHELL_DIR/bin/Release/net10.0/data/"
          ./build/apps/tests/orion-selftest-photo "$RUNNER_TEMP/selftest.dng"
          cd "$SHELL_DIR" && python3 "$GITHUB_WORKSPACE/tools/ci-selftest.py" linux \
            bin/Release/net10.0/Orion "$RUNNER_TEMP/selftest.dng"

      - name: AppImage and update feed (Velopack)
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          VPK="$HOME/.dotnet/tools/vpk" tools/package-linux.sh "$SHELL_DIR" build dist
          cp "$RUNNER_TEMP/selftest.dng" dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: orion-linux
          path: dist/releases/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: orion-linux-floor-photo
          path: dist/selftest.dng
          retention-days: 1

  # The AppImage on systems it was not built on, as a user meets them (#404): bare
  # Ubuntu images with no libicu and only their own libstdc++, plus the Vulkan
  # loader and fontconfig every desktop has. No GPU here, so the engine cannot
  # open a photo: this proves AppRun's one-line refusals, that .NET starts on the
  # bundled ICU (with no system ICU, AppLocalIcu or nothing), and that the shim and
  # every library it loads resolve. The batch export's file names need a GPU.
  linux-floor:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          - ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { name: orion-linux, path: pkg }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { name: orion-linux-floor-photo, path: pkg }
      - name: Bare system, the AppImage unpacked
        run: |
          ldd --version | head -1
          if compgen -G '/usr/lib/x86_64-linux-gnu/libicu*' >/dev/null; then echo "the image has a system ICU" >&2; exit 1; fi
          cd pkg && images=(./*.AppImage) && image=${images[0]} && chmod +x "$image" && "$image" --appimage-extract >/dev/null && ls squashfs-root
      - name: AppRun refuses in one line, without .NET
        run: |
          # $1: what must be missing; the rest: AppRun's arguments.
          refuses() { want=$1; shift
            set +e; out=$(env -u DISPLAY pkg/squashfs-root/AppRun "$@" 2>&1); code=$?; set -e
            echo "exit $code: $out"
            [ $code -ne 0 ] && [ "$(printf '%s\n' "$out" | wc -l)" -eq 1 ] && printf '%s' "$out" | grep -q "^Orion cannot start: .*$want"; }
          refuses libvulkan.so.1 photo.dng
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libvulkan1
          refuses libfontconfig.so.1 photo.dng
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfontconfig1
          refuses DISPLAY photo.dng
          if compgen -G '/usr/lib/x86_64-linux-gnu/libicu*' >/dev/null; then echo "a package brought a system ICU" >&2; exit 1; fi
      - name: .NET on the bundled ICU, the shim and its libraries (batch export)
        run: |
          mkdir in && for n in X x café cafe$(printf '\314\201'); do cp pkg/selftest.dng "in/$n.dng"; done
          set +e; pkg/squashfs-root/AppRun --batch-export out in/*.dng > run.log 2>&1; code=$?; set -e
          cat run.log
          # Four jobs planned (case- and accent-folded names) and each refused for want of a GPU, not a crash.
          grep -q '^orion: exported 0 of 4$' run.log && [ $code -eq 1 ]
          if grep -Ei 'unhandled exception|valid ICU|app-local ICU|DllNotFound|GLIBC' run.log; then exit 1; fi

  windows:
    runs-on: windows-2022
    defaults:
      run: { shell: bash }
    env:
      ORION_VCPKG: ${{ github.workspace }}/../vcpkg   # not VCPKG_ROOT, which msvc-dev-cmd points at Visual Studio's
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: { fetch-depth: 0 }

      # MSVC's environment for clang-cl: its headers, libraries and linker.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1

      - name: vcpkg at the manifest's baseline
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg "$ORION_VCPKG"
          "$ORION_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: vcpkg packages (cached)
        id: vcpkg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-   # vcpkg's own cache is by package ABI: an older one still serves

      - name: Slang
        run: |
          mkdir -p third_party/slang
          curl -fsSL -o "$RUNNER_TEMP/slang.zip" \
            "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-windows-x86_64.zip"
          echo "$SLANG_SHA256_WINDOWS  $RUNNER_TEMP/slang.zip" | sha256sum -c -
          7z x -bd -othird_party/slang "$RUNNER_TEMP/slang.zip" >/dev/null

      # Restore and save apart, so a later failing step still keeps a 40-minute build.
      - name: Dawn (cached)
        id: dawn
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: dawn-windows-${{ env.DAWN_CACHE }}
      - name: Dawn (build)
        if: steps.dawn.outputs.cache-hit != 'true'
        run: tools/build-dawn.sh && rm -rf third_party/dawn-src
      - if: steps.dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: ${{ steps.dawn.outputs.cache-primary-key }}

      # What of Dawn's third_party/ the static library carries, for NOTICE (#376):
      # the C++ namespaces it defines and the source directories its asserts name.
      - name: Dawn third-party audit
        run: |
          set +o pipefail
          libs=(third_party/dawn-build/lib/*webgpu_dawn*); lib=${libs[0]}; ls -la third_party/dawn-build/lib
          nm="nm"; command -v llvm-nm >/dev/null && nm="llvm-nm"
          "$nm" -C --defined-only "$lib" 2>/dev/null | awk '{ $1=""; $2=""; print }' \
            | grep -oE '^ *(\(anonymous namespace\)::)?[A-Za-z_][A-Za-z0-9_]*::' | sort | uniq -c | sort -rn | head -60
          "$nm" --defined-only "$lib" 2>/dev/null | awk '{print $3}' | grep -E '^_?(vk|spv|D3D|DXGI|dxc)' | cut -c1-40 | sort -u | head -40
          # shellcheck disable=SC1003 # tr's argument is one backslash, not an escaped quote
          grep -aoE 'third_party[\\/]+[A-Za-z0-9_.-]+([\\/]+[A-Za-z0-9_.-]+){0,3}' "$lib" | tr '\\' / | sed 's#/\+#/#g' | sort | uniq -c | sort -rn | head -60

      - name: Configure and build
        run: |
          unset VCPKG_ROOT
          # RelWithDebInfo, and so the package: the PDBs give the debugger step below
          # names, and in Release the brush accumulator's first append took the full
          # path twice on WARP (correct pixels, fast path refused), undiagnosed (#376).
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_TOOLCHAIN_FILE="$ORION_VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-release -DORION_SHELL_DIR="$SHELL_DIR"
          cmake --build build -- -k 0   # every error in one run, not the first
      - if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}

      - name: orion-tests (Dawn on D3D12, WARP)
        id: tests
        run: |
          mkdir -p /d/tmp   # the tests write to /tmp, which Windows reads as the drive's \tmp
          ./build/apps/tests/orion-tests.exe
      # Only when they failed: the same run under the Windows SDK's console
      # debugger, so a crash leaves every thread's stack in the log.
      - name: orion-tests under cdb (after a failure)
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          [ -x "$cdb" ] || { echo "no cdb on this image"; exit 0; }
          "$cdb" -lines -c "g; .ecxr; ~*kn 40; q" ./build/apps/tests/orion-tests.exe 2>&1 | tail -300

      # The shell and the packages still run when orion-tests failed (the job stays
      # red): one run then reports every step, not the first failure.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with: { dotnet-version: '10.0.x' }

      - name: Shell selftest (headless)
        id: selftest
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          env -u Platform dotnet build "$SHELL_DIR" -c Release   # msvc-dev-cmd sets Platform=x64, which moves bin/ under x64/
          cp build/shell-native/*.dll "$SHELL_DIR/bin/Release/net10.0/"
          # The engine looks for shaders/ and data/ beside the executable (ResourcePaths.cpp).
          cp -R build/shaders "$SHELL_DIR/bin/Release/net10.0/shaders"
          mkdir -p "$SHELL_DIR/bin/Release/net10.0/data" && cp -R data/lensfun "$SHELL_DIR/bin/Release/net10.0/data/"
          ./build/apps/tests/orion-selftest-photo.exe "$RUNNER_TEMP/selftest.dng"
          cd "$SHELL_DIR" && python "$GITHUB_WORKSPACE/tools/ci-selftest.py" windows \
            bin/Release/net10.0/Orion.exe "$RUNNER_TEMP/selftest.dng"

      - name: Setup.exe, portable zip and update feed (Velopack)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          VPK="$HOME/.dotnet/tools/vpk" tools/package-windows.sh "$SHELL_DIR" build dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          # Uploaded after a failure too, for a look, but never under a green run's name.
          name: orion-windows${{ (steps.tests.outcome != 'success' || steps.selftest.outcome != 'success') && '-tests-failed' || '' }}
          path: dist/releases/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: { fetch-depth: 0 }     # git describe names the package

      - name: Packages
        run: brew install ninja libraw opencv jpeg-xl

      - name: Slang
        run: |
          mkdir -p third_party/slang
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-macos-aarch64.tar.gz"
          echo "$SLANG_SHA256_MACOS  $RUNNER_TEMP/slang.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C third_party/slang

      # Restore and save apart, so a later failing step still keeps a 40-minute build.
      - name: Dawn (cached)
        id: dawn
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: dawn-macos-${{ env.DAWN_CACHE }}
      - name: Dawn (build)
        if: steps.dawn.outputs.cache-hit != 'true'
        run: tools/build-dawn.sh && rm -rf third_party/dawn-src
      - if: steps.dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: third_party/dawn-build
          key: ${{ steps.dawn.outputs.cache-primary-key }}

      # Not the Swift app: the Avalonia shell is the app (#24).
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target orion-tests orion-selftest-photo orion_engine

      - name: orion-tests (Metal, then Dawn on Metal)
        run: |
          ./build/apps/tests/orion-tests
          ORION_GPU=dawn ./build/apps/tests/orion-tests

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with: { dotnet-version: '10.0.x' }

      - name: Shell selftest (headless)
        run: |
          "$SHELL_DIR/native/build.sh"
          dotnet build "$SHELL_DIR" -c Release
          ./build/apps/tests/orion-selftest-photo "$RUNNER_TEMP/selftest.dng"
          cd "$SHELL_DIR" && python3 "$GITHUB_WORKSPACE/tools/ci-selftest.py" macos \
            bin/Release/net10.0/Orion "$RUNNER_TEMP/selftest.dng"

      # package-app.sh's gates, then Velopack's feed and the disk image made from its app
      # (#389); check-agent is its one stated skip here, with no sample RAW on CI.
      - name: Orion.app, disk image and update feed (Velopack)
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          VPK="$HOME/.dotnet/tools/vpk" tools/package-app.sh "$GITHUB_WORKSPACE/dist"
          # The app the disk image carries starts, from Velopack's output.
          dist/Orion.app/Contents/MacOS/Orion "$RUNNER_TEMP/selftest.dng" --screenshot "$RUNNER_TEMP/packaged.png"
          test -s "$RUNNER_TEMP/packaged.png"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: orion-macos
          path: |
            dist/*.dmg
            dist/releases/*
