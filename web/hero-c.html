<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion hero, variant C</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="img/orion-icon.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hero-variants.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav__in">
    <a class="nav__mark" href="./" aria-label="Orion, home"><img src="img/orion-mark.svg" width="32" height="30" alt="" aria-hidden="true">Orion</a>
    <nav class="nav__nav" aria-label="Sections"><ul class="nav__links" id="nav-links"><li><a href="./#raw">RAW</a></li><li><a href="./#files">Your files</a></li><li><a href="./#build">Features</a></li></ul></nav>
    <a class="btn nav__cta" href="download/" data-os-label>Download for Mac</a>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu"><span></span></button>
  </div>
</header>
<main>
<section class="hv hv--c" aria-labelledby="hero-title">
  <!-- one frame, as shot on the left and developed on the right: the picture develops across the hero -->
  <div class="hv__photo" aria-hidden="true">
    <img src="img/hero-asshot-2400.jpg" srcset="img/hero-asshot-1200.jpg 1200w, img/hero-asshot-1600.jpg 1600w, img/hero-asshot-2400.jpg 2400w" sizes="100vw" width="2400" height="1987" alt="" decoding="async">
    <img src="img/hero-edit-2400.jpg" srcset="img/hero-edit-1200.jpg 1200w, img/hero-edit-1600.jpg 1600w, img/hero-edit-2400.jpg 2400w" sizes="100vw" width="2400" height="1987" alt="" decoding="async">
  </div>
  <div class="wrap hv__copy">
    <h1 class="h1" id="hero-title">Fast RAW editing for free</h1>
    <p class="lede">Full-resolution renders on every slider move. No subscription, no account.</p>
    <a class="btn btn--lg" href="download/">Download for Mac</a>
    <p class="mono">macOS 14 or later, Apple silicon. Alpha.</p>
  </div>
  <div class="hv__window hv__lit">
    <img src="img/app-ev3-1800.jpg" srcset="img/app-ev3-1200.jpg 1200w, img/app-ev3-1800.jpg 1800w" sizes="(max-width: 1280px) 94vw, 1200px" width="1800" height="1125" fetchpriority="high" decoding="async"
         alt="Orion's window: a night photograph of cars outside a showroom, with the Light panel's sliders beside it.">
  </div>
</section>
</main>
<script src="js/site.js" defer></script>
</body>
</html>
