<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orion Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#141416}
a{color:#4DB6C4}a:hover{color:#7fd0db}
.num{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0.01em}
button{font:inherit;color:inherit;cursor:pointer;transition:transform 100ms ease-out}
button:active{transform:scale(0.97)}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 2px #141416,0 0 0 4px #4DB6C4}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; flex-direction: column; overflow: auto; background: #141416; color: #E8E8EA; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 14px; min-height: 48px; box-sizing: border-box; background: #1B1B1D; border-bottom: 1px solid #313135">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em">Orion</span>
      <button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; background: #232326; border: 1px solid #313135; border-radius: 5px; font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"></path></svg>
        Open
      </button>
      <span style="color: #8A8A90">samples</span>
    </div>
    <div style="display: flex; padding: 2px; background: #141416; border: 1px solid #313135; border-radius: 6px" role="group" aria-label="Mode">
      <button aria-pressed="true" style="height: 24px; padding: 0 14px; border: 0; border-radius: 4px; background: #232326; color: #E8E8EA">Library</button>
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 24px; padding: 0 14px; border-radius: 4px; color: #8A8A90; text-decoration: none">Develop</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex: 1 1 260px; justify-content: flex-end">
      <button style="height: 28px; padding: 0 10px; background: transparent; border: 1px solid #313135; border-radius: 5px; color: #8A8A90">Delete rejected…</button>
      <button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; background: #4DB6C4; border: 0; border-radius: 5px; color: #0E1416; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"></path></svg>
        Export 1
      </button>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap">
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #313135">
        <div style="display: flex; padding: 2px; background: #1B1B1D; border: 1px solid #313135; border-radius: 6px" role="group" aria-label="Filter">
          <button aria-pressed="true" style="height: 24px; padding: 0 12px; border: 0; border-radius: 4px; background: #232326">All <span class="num" style="color: #8A8A90; font-size: 13px">3</span></button>
          <button aria-pressed="false" style="height: 24px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #8A8A90">Rated <span class="num" style="font-size: 13px">1</span></button>
          <button aria-pressed="false" style="height: 24px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #8A8A90">Rejected <span class="num" style="font-size: 13px">0</span></button>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; color: #8A8A90">Sort
          <select style="height: 26px; background: #232326; color: #E8E8EA; border: 1px solid #313135; border-radius: 4px; font: inherit">
            <option>Capture time</option><option>File name</option><option>Rating</option>
          </select>
        </label>
        <span style="flex: 1"></span>
        <label style="display: flex; align-items: center; gap: 8px; color: #8A8A90">Size
          <input type="range" min="120" max="400" value="240" style="width: 120px; accent-color: #4DB6C4">
        </label>
      </div>

      <div style="flex: 1 1 auto; overflow-y: auto; padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; align-content: start">
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
          <button aria-label="_PIC8095.ARW, 3 stars, selected" aria-current="true" style="aspect-ratio: 3 / 2; padding: 0; border: 2px solid #4DB6C4; border-radius: 5px; background: #232326; overflow: hidden; display: flex; align-items: center; justify-content: center">
            <img src="/_blob/b3184c52635dba7e94640c9e527d0517" alt="Space Needle against a blue sky" style="height: 100%; object-fit: contain; display: block">
          </button>
          <figcaption style="display: flex; justify-content: space-between; align-items: center">
            <span>_PIC8095.ARW</span>
            <span style="color: #F0C674; letter-spacing: 1px" aria-label="3 stars">★★★<span style="color: #5A5A60">★★</span></span>
          </figcaption>
        </figure>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
          <button aria-label="_PIC8148.ARW, unrated" style="aspect-ratio: 3 / 2; padding: 0; border: 2px solid transparent; border-radius: 5px; background: #232326; overflow: hidden">
            <img src="/_blob/2559d1f9cf1b4a62f179687b2d52743b" alt="Night sky over a dark treeline" style="width: 100%; height: 100%; object-fit: cover; display: block">
          </button>
          <figcaption style="display: flex; justify-content: space-between; align-items: center">
            <span>_PIC8148.ARW</span>
            <span style="color: #5A5A60; letter-spacing: 1px" aria-label="Unrated">★★★★★</span>
          </figcaption>
        </figure>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
          <button aria-label="_PIC8220.ARW, unrated" style="aspect-ratio: 3 / 2; padding: 0; border: 2px solid transparent; border-radius: 5px; background: #232326; overflow: hidden">
            <img src="/_blob/dc394ea5edc9680ae145409fd3374730" alt="Sports cars parked outside a lit showroom at night" style="width: 100%; height: 100%; object-fit: cover; display: block">
          </button>
          <figcaption style="display: flex; justify-content: space-between; align-items: center">
            <span>_PIC8220.ARW</span>
            <span style="color: #5A5A60; letter-spacing: 1px" aria-label="Unrated">★★★★★</span>
          </figcaption>
        </figure>
      </div>
    </main>

    <aside style="flex: 1 1 280px; min-width: 0; background: #1B1B1D; border-left: 1px solid #313135; padding: 18px 14px; display: flex; flex-direction: column; gap: 18px" aria-label="Photo info">
      <img src="/_blob/b3184c52635dba7e94640c9e527d0517" alt="" style="width: 100%; max-height: 220px; object-fit: contain; background: #232326; border-radius: 4px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500">_PIC8095.ARW</span>
        <span style="color: #8A8A90"><span class="num" style="font-size: 13px">4024 × 6024</span> Sony raw</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600">Capture</h2>
        <span style="flex: 1; height: 1px; background: #313135" aria-hidden="true"></span>
      </div>
      <dl class="num" style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; font-size: 13px">
        <dt style="color: #8A8A90">Camera</dt><dd style="margin: 0">Sony ILCE-7M3</dd>
        <dt style="color: #8A8A90">Focal length</dt><dd style="margin: 0">24 mm</dd>
        <dt style="color: #8A8A90">Aperture</dt><dd style="margin: 0">f/4.0</dd>
        <dt style="color: #8A8A90">Shutter</dt><dd style="margin: 0">1/640 s</dd>
        <dt style="color: #8A8A90">ISO</dt><dd style="margin: 0">800</dd>
      </dl>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 5px; background: #232326; border: 1px solid #313135; color: #E8E8EA; text-decoration: none">Open in Develop</a>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
